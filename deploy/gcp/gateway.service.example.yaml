# INERT TEMPLATE. No deployment, billing or cloud/model execution is authorized.
# Supply reviewed origins/image/token after the durable backend is tested.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: frameseek-gateway
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '2'
    spec:
      containerConcurrency: 32
      timeoutSeconds: 300
      containers:
        - image: REPLACE_WITH_REVIEWED_IMAGE_DIGEST
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: '1'
              memory: 512Mi
          env:
            - name: FS_COMPONENT
              value: gateway
            - name: FS_PUBLIC_ORIGIN
              value: https://REPLACE_WITH_PUBLIC_GATEWAY_HOST
            - name: FS_BACKEND_ORIGIN
              value: https://REPLACE_WITH_GCP_BACKEND_HOST
            - name: FS_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: REPLACE_WITH_PRIVATE_GATEWAY_SECRET
                  key: latest
