# Temporary ACME bootstrap: application stays private until valid TLS is ready.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
server {
    listen 80;
    server_name framefix.net www.framefix.net;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 503;
    }
}
